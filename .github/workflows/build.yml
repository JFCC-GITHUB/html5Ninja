name: Build check
on:
  pull_request:
  push:
    branches: [main]
env:
  GODOT_VERSION: "4.7-stable" # keep in sync with config/features in godot_project/project.godot
jobs:
  export-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and web export templates
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}
          curl -fsSL -o godot.zip $base/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          curl -fsSL -o tpl.tpz $base/Godot_v${GODOT_VERSION}_export_templates.tpz
          unzip -q godot.zip && unzip -q tpl.tpz
          v=${GODOT_VERSION/-/.}
          mkdir -p ~/.local/share/godot/export_templates/$v ~/.local/bin
          mv templates/* ~/.local/share/godot/export_templates/$v/
          mv Godot_v${GODOT_VERSION}_linux.x86_64 ~/.local/bin/godot
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Export with build.sh (fails the PR if the project does not build)
        run: |
          godot --headless --path godot_project --import
          ./build.sh
          mkdir dist && cp index.* dist/
          test -s dist/index.wasm && test -s dist/index.pck
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name == 'push'
    needs: export-web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
