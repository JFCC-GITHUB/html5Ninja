<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>忍者手裏劍 - Pixel Ninja Defense</title>
  <style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}

body {
  background-color: #0d0f18;
  color: #ffffff;
  font-family: 'Courier New', Courier, monospace, monospace;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
}

#game-container {
  position: relative;
  width: 100vw;
  max-width: 960px;
  height: 100vh;
  max-height: 540px;
  background-color: #1a1c29;
  box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

#gameCanvas {
  width: 100%;
  height: 100%;
  object-fit: contain;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  display: block;
  background-color: #111;
}

#ui-layer {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.hidden {
  display: none !important;
}

#hud {
  pointer-events: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 20px;
  background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
  z-index: 10;
}

.hud-item {
  display: flex;
  align-items: center;
  font-size: 1.1rem;
  font-weight: bold;
  text-shadow: 2px 2px 0 #000;
}

.hud-label {
  color: #f39c12;
  margin-right: 6px;
}

#hp-hearts {
  display: flex;
  gap: 4px;
  font-size: 1.3rem;
}

.icon-btn {
  background: rgba(255, 255, 255, 0.15);
  border: 2px solid #fff;
  color: #fff;
  padding: 4px 10px;
  font-size: 1.1rem;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.2s;
}

.icon-btn:hover {
  background: rgba(255, 255, 255, 0.3);
}

.overlay-screen {
  pointer-events: auto;
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(10, 12, 20, 0.88);
  backdrop-filter: blur(4px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 20;
  text-align: center;
  padding: 20px;
}

.game-title {
  font-size: 2.5rem;
  color: #e74c3c;
  text-shadow: 3px 3px 0 #000, -2px -2px 0 #ff6b6b;
  margin-bottom: 4px;
  letter-spacing: 2px;
}

.game-subtitle {
  font-size: 1rem;
  color: #f1c40f;
  margin-bottom: 20px;
  letter-spacing: 4px;
}

.gameover-title {
  font-size: 2.8rem;
  color: #e74c3c;
  text-shadow: 4px 4px 0 #000;
  margin-bottom: 15px;
}

.menu-box {
  background: rgba(20, 24, 38, 0.9);
  border: 3px solid #f39c12;
  border-radius: 12px;
  padding: 24px 32px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  width: 90%;
  max-width: 420px;
}

.difficulty-buttons {
  display: flex;
  gap: 8px;
  width: 100%;
  justify-content: center;
}

.btn {
  background: #2c3e50;
  color: #fff;
  border: 2px solid #7f8c8d;
  padding: 8px 16px;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: bold;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s ease-in-out;
  box-shadow: 0 4px 0 #1a252f;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 0 #1a252f;
  filter: brightness(1.1);
}

.btn:active {
  transform: translateY(2px);
  box-shadow: 0 2px 0 #1a252f;
}

.btn-diff {
  flex: 1;
  padding: 8px 4px;
  font-size: 0.85rem;
  background: #34495e;
}

.btn-diff.active {
  background: #e67e22;
  border-color: #f1c40f;
  box-shadow: 0 4px 0 #a04000;
}

.btn-primary {
  background: #e74c3c;
  border-color: #ff6b6b;
  box-shadow: 0 4px 0 #922b21;
}

.btn-large {
  width: 100%;
  padding: 12px 24px;
  font-size: 1.2rem;
  margin-top: 8px;
}

.btn-secondary {
  width: 100%;
  background: #34495e;
}

.controls-guide {
  margin-top: 18px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 8px;
  padding: 10px 16px;
  font-size: 0.8rem;
  color: #bdc3c7;
  max-width: 460px;
  line-height: 1.4;
}

.controls-guide h3 {
  color: #f1c40f;
  margin-bottom: 4px;
}

.final-score {
  font-size: 1.4rem;
  color: #2ecc71;
  font-weight: bold;
}

.best-score {
  font-size: 1rem;
  color: #f1c40f;
}

.new-record {
  color: #f39c12;
  font-weight: bold;
  animation: pulse 1s infinite alternate;
}

@keyframes pulse {
  from { transform: scale(1); }
  to { transform: scale(1.08); }
}

#touch-controls {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: flex;
  pointer-events: auto;
  z-index: 5;
}

.touch-zone {
  flex: 1;
  height: 100%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 25px;
  opacity: 0.35;
  transition: opacity 0.15s;
}

.touch-zone:active {
  opacity: 0.75;
  background: rgba(255, 255, 255, 0.1);
}

.touch-sword-btn {
  position: absolute;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  background: rgba(231, 76, 60, 0.85);
  border: 2px solid #ff6b6b;
  color: #fff;
  padding: 10px 20px;
  border-radius: 25px;
  font-size: 1rem;
  font-weight: bold;
  box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  cursor: pointer;
  touch-action: manipulation;
}

.touch-sword-btn:active {
  background: rgba(192, 57, 43, 1);
  transform: translateX(-50%) scale(0.95);
}

.touch-hint {
  background: rgba(0, 0, 0, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.4);
  color: #fff;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 0.85rem;
  font-weight: bold;
}

@media (max-width: 600px) {
  .game-title { font-size: 1.8rem; }
  .menu-box { padding: 16px; }
  .btn-large { font-size: 1rem; }
}
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
      <div id="hud" class="hidden">
        <div id="hp-container" class="hud-item">
          <span class="hud-label">HP:</span>
          <div id="hp-hearts"></div>
        </div>
        <div id="score-container" class="hud-item">
          <span class="hud-label">SCORE:</span>
          <span id="score-val">0</span>
        </div>
        <div id="high-score-container" class="hud-item">
          <span class="hud-label">BEST:</span>
          <span id="high-score-val">0</span>
        </div>
        <button id="btn-pause" class="icon-btn">⏸</button>
      </div>

      <div id="menu-screen" class="overlay-screen">
        <h1 class="game-title">🥷 忍者手裏劍 🥷</h1>
        <p class="game-subtitle">SHURIKEN HERO</p>

        <div class="menu-box">
          <h2>選擇難度 (Difficulty)</h2>
          <div class="difficulty-buttons">
            <button class="btn btn-diff" data-diff="EASY">簡單 (Easy)</button>
            <button class="btn btn-diff active" data-diff="NORMAL">普通 (Normal)</button>
            <button class="btn btn-diff" data-diff="HARD">困難 (Hard)</button>
          </div>

          <button id="btn-start" class="btn btn-primary btn-large">開始遊戲 (START)</button>
        </div>

        <div class="controls-guide">
          <h3>🎮 操作說明</h3>
          <p><strong>電腦：</strong> A / D 或 ⬅️ / ➡️ 移動 & 按住連發 | Space 射擊 | J / Z 武士刀近戰斬擊</p>
          <p><strong>手機 (iPhone)：</strong> 按住螢幕左/右半邊連射 | 點擊中央 ⚔️ 斬擊按鈕進行近戰</p>
        </div>
      </div>

      <div id="pause-screen" class="overlay-screen hidden">
        <h2>遊戲暫停 (PAUSED)</h2>
        <div class="menu-box">
          <button id="btn-resume" class="btn btn-primary">繼續遊戲 (Resume)</button>
          <button id="btn-restart-pause" class="btn btn-secondary">重新開始 (Restart)</button>
          <button id="btn-menu-pause" class="btn btn-secondary">返回主選單 (Main Menu)</button>
        </div>
      </div>

      <div id="gameover-screen" class="overlay-screen hidden">
        <h1 class="gameover-title">💀 GAME OVER 💀</h1>
        <div class="menu-box">
          <p class="final-score">最終得分：<span id="final-score-val">0</span></p>
          <p class="new-record hidden" id="new-record-tag">🎉 刷新最高紀錄！ 🎉</p>
          <p class="best-score">歷史最高：<span id="final-best-val">0</span></p>

          <button id="btn-restart" class="btn btn-primary btn-large">再試一次 (Play Again)</button>
          <button id="btn-menu-gameover" class="btn btn-secondary">返回主選單 (Main Menu)</button>
        </div>
      </div>

      <div id="touch-controls" class="hidden">
        <div id="touch-left" class="touch-zone">
          <span class="touch-hint">⬅️ 左移 & 射擊</span>
        </div>
        <button id="touch-sword" class="touch-sword-btn">⚔️ 斬擊</button>
        <div id="touch-right" class="touch-zone">
          <span class="touch-hint">➡️ 右移 & 射擊</span>
        </div>
      </div>
    </div>
  </div>

  <script>
const GAME_CONFIG = {
  CANVAS_WIDTH: 800,
  CANVAS_HEIGHT: 450,
  HIGH_SCORE_KEY: 'ninja_game_high_score',
  PLAYER: {
    INITIAL_HP: 3,
    INVINCIBILITY_DURATION_MS: 1500,
    SPEED: 4,
    WIDTH: 36,
    HEIGHT: 48,
    MOVE_BOUNDS_MARGIN: 100,
    SHOOT_COOLDOWN_MS: 180,
    SWORD_COOLDOWN_MS: 300,
    SWORD_RANGE: 65,
    SWORD_DURATION_MS: 180,
  },
  SHURIKEN: {
    SPEED: 9,
    SIZE: 16,
    MAX_COUNT: 10,
  },
  DIFFICULTIES: {
    EASY: { label: '簡單 (Easy)', enemySpeedMultiplier: 0.8, enemySpawnRateMultiplier: 1.3, playerHp: 4, scoreMultiplier: 1.0 },
    NORMAL: { label: '普通 (Normal)', enemySpeedMultiplier: 1.0, enemySpawnRateMultiplier: 1.0, playerHp: 3, scoreMultiplier: 1.5 },
    HARD: { label: '困難 (Hard)', enemySpeedMultiplier: 1.3, enemySpawnRateMultiplier: 0.7, playerHp: 2, scoreMultiplier: 2.0 }
  },
  ENEMY_TYPES: {
    NORMAL: { id: 'NORMAL', name: '普通忍', width: 32, height: 44, baseSpeed: 1.8, hp: 1, scoreValue: 100, color: '#e74c3c', spawnWeight: 60 },
    FAST: { id: 'FAST', name: '疾風忍', width: 28, height: 38, baseSpeed: 3.2, hp: 1, scoreValue: 200, color: '#f1c40f', spawnWeight: 25 },
    TANK: { id: 'TANK', name: '重裝忍', width: 44, height: 56, baseSpeed: 1.0, hp: 3, scoreValue: 350, color: '#8e44ad', spawnWeight: 15 }
  },
  SPAWN: {
    INITIAL_INTERVAL_MS: 1800,
    MIN_INTERVAL_MS: 500,
    DIFFICULTY_RAMP_INTERVAL_MS: 5000,
    INTERVAL_DECREASE_STEP: 50,
  },
  PARTICLES: {
    HIT_COUNT: 12,
    DEATH_COUNT: 25,
  }
};

const SpriteGenerator = (function () {
  function createCanvas(w, h) {
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    return { canvas, ctx };
  }

  function drawPixelMatrix(ctx, matrix, palette, pixelSize = 2, offsetX = 0, offsetY = 0) {
    for (let r = 0; r < matrix.length; r++) {
      const row = matrix[r];
      for (let c = 0; c < row.length; c++) {
        const char = row[c];
        if (char !== '.' && palette[char]) {
          ctx.fillStyle = palette[char];
          ctx.fillRect(offsetX + c * pixelSize, offsetY + r * pixelSize, pixelSize, pixelSize);
        }
      }
    }
  }

  const NINJA_PALETTE = { 'B': '#1a1a24', 'D': '#2d2d44', 'S': '#f1c40f', 'F': '#ffdbac', 'E': '#000000', 'R': '#e74c3c' };
  const NINJA_IDLE_MATRIX = [
    "......RRRRRR......", ".....RRRRRRRR.....", "....BBBBBBBBBB....", "...BBBBBBBBBBBB...",
    "...BBFFFFFFBBBB...", "...BBFEFFEFEBBB...", "...BBFFFFFFBBBB...", "...SSSSSSSSSSSS...",
    "....BBBBBBBBBB....", "....BDDDDDBBBB....", "...BBDDDDDDBBBB...", "...BBDDDDDDBBBB...",
    "...BDDDDDDDDBBB...", "...BDDDDDDDDBBB...", "...BDDDDDDDDBBB...", "....BDDDDDDDDB....",
    "....BBBB..BBBB....", "....BBBB..BBBB....", "....BBBB..BBBB....", "....BBBB..BBBB....",
    "....BBBB..BBBB....", "...BBBBB..BBBBB...", "...BBBBB..BBBBB...", ".................."
  ];
  const NINJA_RUN_MATRIX = [
    "......RRRRRR......", ".....RRRRRRRR.....", "....BBBBBBBBBB....", "...BBBBBBBBBBBB...",
    "...BBFFFFFFBBBB...", "...BBFEFFEFEBBB...", "...BBFFFFFFBBBB...", "...SSSSSSSSSSSS...",
    "....BBBBBBBBBB....", "....BDDDDDBBBB....", "...BBDDDDDDBBBB...", "...BBDDDDDDBBBB...",
    "...BDDDDDDDDBBB...", "...BDDDDDDDDBBB...", "....BDDDDDDDDB....", ".....BBBBBBBB.....",
    "....BBBB...BBBB...", "...BBBB.....BBBB..", "..BBBB.......BBBB.", "..BBBB.......BBBB.",
    ".BBBBB.......BBBBB", ".BBBBB.......BBBBB", ".................."
  ];

  function createNinjaSprites() {
    const pSize = 2; const width = 36; const height = 48;
    const idleLeft = createCanvas(width, height); drawPixelMatrix(idleLeft.ctx, NINJA_IDLE_MATRIX, NINJA_PALETTE, pSize);
    const idleRight = createCanvas(width, height); idleRight.ctx.translate(width, 0); idleRight.ctx.scale(-1, 1); drawPixelMatrix(idleRight.ctx, NINJA_IDLE_MATRIX, NINJA_PALETTE, pSize);
    const runLeft = createCanvas(width, height); drawPixelMatrix(runLeft.ctx, NINJA_RUN_MATRIX, NINJA_PALETTE, pSize);
    const runRight = createCanvas(width, height); runRight.ctx.translate(width, 0); runRight.ctx.scale(-1, 1); drawPixelMatrix(runRight.ctx, NINJA_RUN_MATRIX, NINJA_PALETTE, pSize);
    return { idleRight: idleRight.canvas, idleLeft: idleLeft.canvas, runRight: runRight.canvas, runLeft: runLeft.canvas };
  }

  function createShurikenSprite() {
    const { canvas, ctx } = createCanvas(16, 16);
    ctx.fillStyle = '#bdc3c7'; ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(8, 0); ctx.lineTo(10, 6); ctx.lineTo(16, 8); ctx.lineTo(10, 10);
    ctx.lineTo(8, 16); ctx.lineTo(6, 10); ctx.lineTo(0, 8); ctx.lineTo(6, 6);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(8, 8, 2.5, 0, Math.PI * 2); ctx.fill();
    return canvas;
  }

  function createEnemySprites(colorMain, colorSub, width, height) {
    const { canvas, ctx } = createCanvas(width, height);
    const pSize = Math.floor(width / 16);
    ctx.fillStyle = colorMain; ctx.fillRect(pSize * 2, pSize * 2, width - pSize * 4, height - pSize * 4);
    ctx.fillStyle = '#111'; ctx.fillRect(pSize * 3, pSize * 3, width - pSize * 6, pSize * 6);
    ctx.fillStyle = '#fff'; ctx.fillRect(pSize * 4, pSize * 5, pSize * 2, pSize * 2); ctx.fillRect(width - pSize * 6, pSize * 5, pSize * 2, pSize * 2);
    ctx.fillStyle = '#e74c3c'; ctx.fillRect(pSize * 5, pSize * 5, pSize, pSize * 2); ctx.fillRect(width - pSize * 5, pSize * 5, pSize, pSize * 2);
    ctx.fillStyle = colorSub; ctx.fillRect(pSize * 2, pSize * 2, width - pSize * 4, pSize * 2);
    ctx.fillStyle = '#2c3e50'; ctx.fillRect(pSize * 2, height / 2, width - pSize * 4, pSize * 3);
    ctx.fillStyle = colorMain; ctx.fillRect(pSize * 3, height - pSize * 5, pSize * 4, pSize * 5); ctx.fillRect(width - pSize * 7, height - pSize * 5, pSize * 4, pSize * 5);
    const leftCanvas = createCanvas(width, height); leftCanvas.ctx.translate(width, 0); leftCanvas.ctx.scale(-1, 1); leftCanvas.ctx.drawImage(canvas, 0, 0);
    return { right: canvas, left: leftCanvas.canvas };
  }

  let cache = null;
  function init() {
    if (cache) return cache;
    cache = {
      ninja: createNinjaSprites(),
      shuriken: createShurikenSprite(),
      enemies: {
        NORMAL: createEnemySprites(GAME_CONFIG.ENEMY_TYPES.NORMAL.color, '#c0392b', GAME_CONFIG.ENEMY_TYPES.NORMAL.width, GAME_CONFIG.ENEMY_TYPES.NORMAL.height),
        FAST: createEnemySprites(GAME_CONFIG.ENEMY_TYPES.FAST.color, '#f39c12', GAME_CONFIG.ENEMY_TYPES.FAST.width, GAME_CONFIG.ENEMY_TYPES.FAST.height),
        TANK: createEnemySprites(GAME_CONFIG.ENEMY_TYPES.TANK.color, '#9b59b6', GAME_CONFIG.ENEMY_TYPES.TANK.width, GAME_CONFIG.ENEMY_TYPES.TANK.height),
      }
    };
    return cache;
  }
  return { getSprites: init };
})();

const SoundSystem = (function () {
  let audioCtx = null;
  function initAudioContext() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playTone(freq, type = 'square', duration = 0.1, startVol = 0.2, endVol = 0) {
    try {
      initAudioContext();
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(startVol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(Math.max(endVol, 0.0001), audioCtx.currentTime + duration);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }
  return {
    init: initAudioContext,
    playShurikenThrow: () => playTone(800, 'sawtooth', 0.08, 0.15, 0.01),
    playEnemyHit: () => playTone(220, 'square', 0.12, 0.25, 0.01),
    playPlayerHurt: () => playTone(150, 'sawtooth', 0.2, 0.3, 0.01),
    playGameOver: () => [400, 350, 300, 250, 180].forEach((f, i) => setTimeout(() => playTone(f, 'triangle', 0.2, 0.25, 0.01), i * 120)),
    playClick: () => playTone(600, 'sine', 0.05, 0.15, 0.01),
    playSwordSlash: () => playTone(1200, 'sawtooth', 0.1, 0.3, 0.01)
  };
})();

window.addEventListener('DOMContentLoaded', () => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = GAME_CONFIG.CANVAS_WIDTH;
  canvas.height = GAME_CONFIG.CANVAS_HEIGHT;

  const menuScreen = document.getElementById('menu-screen');
  const pauseScreen = document.getElementById('pause-screen');
  const gameOverScreen = document.getElementById('gameover-screen');
  const hud = document.getElementById('hud');
  const touchControls = document.getElementById('touch-controls');
  const hpHearts = document.getElementById('hp-hearts');
  const scoreVal = document.getElementById('score-val');
  const highScoreVal = document.getElementById('high-score-val');
  const finalScoreVal = document.getElementById('final-score-val');
  const finalBestVal = document.getElementById('final-best-val');
  const newRecordTag = document.getElementById('new-record-tag');

  const btnStart = document.getElementById('btn-start');
  const btnPause = document.getElementById('btn-pause');
  const btnResume = document.getElementById('btn-resume');
  const btnRestartPause = document.getElementById('btn-restart-pause');
  const btnMenuPause = document.getElementById('btn-menu-pause');
  const btnRestart = document.getElementById('btn-restart');
  const btnMenuGameOver = document.getElementById('btn-menu-gameover');
  const diffButtons = document.querySelectorAll('.btn-diff');

  const touchLeft = document.getElementById('touch-left');
  const touchRight = document.getElementById('touch-right');
  const touchSword = document.getElementById('touch-sword');

  const sprites = SpriteGenerator.getSprites();

  let gameState = 'MENU';
  let selectedDifficulty = 'NORMAL';
  let score = 0;
  let highScore = parseInt(localStorage.getItem(GAME_CONFIG.HIGH_SCORE_KEY) || '0', 10);

  let player = null;
  let shurikens = [];
  let enemies = [];
  let particles = [];
  let lastSpawnTime = 0;
  let gameStartTime = 0;
  let lastShootTime = 0;
  let lastSwordTime = 0;

  const keys = { left: false, right: false, shoot: false, sword: false };
  highScoreVal.textContent = highScore;

  function createPlayer(maxHp) {
    return {
      x: GAME_CONFIG.CANVAS_WIDTH / 2 - GAME_CONFIG.PLAYER.WIDTH / 2,
      y: GAME_CONFIG.CANVAS_HEIGHT - GAME_CONFIG.PLAYER.HEIGHT - 40,
      width: GAME_CONFIG.PLAYER.WIDTH, height: GAME_CONFIG.PLAYER.HEIGHT,
      facing: 'RIGHT', hp: maxHp, maxHp: maxHp, isInvincible: false, invincibleUntil: 0, isMoving: false,
      isSwordslashing: false, swordUntil: 0,
    };
  }

  function shootShuriken() {
    const now = Date.now();
    if (now - lastShootTime < GAME_CONFIG.PLAYER.SHOOT_COOLDOWN_MS) return;
    if (shurikens.length >= GAME_CONFIG.SHURIKEN.MAX_COUNT) return;
    lastShootTime = now;
    SoundSystem.playShurikenThrow();
    const dir = player.facing === 'RIGHT' ? 1 : -1;
    shurikens.push({
      x: player.facing === 'RIGHT' ? player.x + player.width : player.x - GAME_CONFIG.SHURIKEN.SIZE,
      y: player.y + 16, vx: GAME_CONFIG.SHURIKEN.SPEED * dir, size: GAME_CONFIG.SHURIKEN.SIZE, rotation: 0,
    });
  }

  function performSwordAttack() {
    const now = Date.now();
    if (now - lastSwordTime < GAME_CONFIG.PLAYER.SWORD_COOLDOWN_MS) return;
    lastSwordTime = now;
    player.isSwordslashing = true;
    player.swordUntil = now + GAME_CONFIG.PLAYER.SWORD_DURATION_MS;
    SoundSystem.playSwordSlash();

    const swordBox = {
      x: player.facing === 'RIGHT' ? player.x + player.width : player.x - GAME_CONFIG.PLAYER.SWORD_RANGE,
      y: player.y,
      width: GAME_CONFIG.PLAYER.SWORD_RANGE,
      height: player.height
    };

    const diff = GAME_CONFIG.DIFFICULTIES[selectedDifficulty];
    for (let eIdx = enemies.length - 1; eIdx >= 0; eIdx--) {
      const enemy = enemies[eIdx];
      if (checkAABBCollision(swordBox, enemy)) {
        enemy.hp -= 2;
        createParticles(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, '#e74c3c', 12);
        if (enemy.hp <= 0) {
          SoundSystem.playEnemyHit();
          createParticles(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, GAME_CONFIG.ENEMY_TYPES[enemy.type].color, GAME_CONFIG.PARTICLES.DEATH_COUNT);
          score += Math.round(enemy.scoreValue * diff.scoreMultiplier);
          scoreVal.textContent = score;
          enemies.splice(eIdx, 1);
        } else {
          SoundSystem.playEnemyHit();
        }
      }
    }
  }

  function spawnEnemy() {
    const diff = GAME_CONFIG.DIFFICULTIES[selectedDifficulty];
    const side = Math.random() < 0.5 ? 'LEFT' : 'RIGHT';
    const rand = Math.random() * 100;
    let typeConfig = GAME_CONFIG.ENEMY_TYPES.NORMAL;
    if (rand > 100 - GAME_CONFIG.ENEMY_TYPES.TANK.spawnWeight) typeConfig = GAME_CONFIG.ENEMY_TYPES.TANK;
    else if (rand > 100 - GAME_CONFIG.ENEMY_TYPES.TANK.spawnWeight - GAME_CONFIG.ENEMY_TYPES.FAST.spawnWeight) typeConfig = GAME_CONFIG.ENEMY_TYPES.FAST;

    const startX = side === 'LEFT' ? -typeConfig.width - 10 : GAME_CONFIG.CANVAS_WIDTH + 10;
    const moveDir = side === 'LEFT' ? 1 : -1;
    enemies.push({
      type: typeConfig.id, x: startX, y: GAME_CONFIG.CANVAS_HEIGHT - typeConfig.height - 40,
      width: typeConfig.width, height: typeConfig.height,
      vx: typeConfig.baseSpeed * diff.enemySpeedMultiplier * moveDir,
      hp: typeConfig.hp, maxHp: typeConfig.hp, scoreValue: typeConfig.scoreValue,
      facing: side === 'LEFT' ? 'RIGHT' : 'LEFT',
    });
  }

  function createParticles(x, y, color, count = GAME_CONFIG.PARTICLES.HIT_COUNT) {
    for (let i = 0; i < count; i++) {
      particles.push({
        x, y, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6,
        size: Math.random() * 4 + 2, color, alpha: 1, life: 1.0,
      });
    }
  }

  function checkAABBCollision(rect1, rect2) {
    return rect1.x < rect2.x + rect2.width && rect1.x + rect1.width > rect2.x && rect1.y < rect2.y + rect2.height && rect1.y + rect1.height > rect2.y;
  }

  function updateHpDisplay() {
    hpHearts.innerHTML = '';
    for (let i = 0; i < player.maxHp; i++) {
      const heart = document.createElement('span');
      heart.textContent = i < player.hp ? '❤️' : '🖤';
      hpHearts.appendChild(heart);
    }
  }

  function startGame() {
    SoundSystem.playClick();
    const diff = GAME_CONFIG.DIFFICULTIES[selectedDifficulty];
    score = 0; gameStartTime = Date.now(); lastSpawnTime = Date.now();
    shurikens = []; enemies = []; particles = [];
    player = createPlayer(diff.playerHp); updateHpDisplay(); scoreVal.textContent = '0';
    menuScreen.classList.add('hidden'); pauseScreen.classList.add('hidden'); gameOverScreen.classList.add('hidden');
    hud.classList.remove('hidden'); touchControls.classList.remove('hidden');
    gameState = 'PLAYING';
  }

  function triggerGameOver() {
    gameState = 'GAMEOVER'; SoundSystem.playGameOver();
    let isNewRecord = false;
    if (score > highScore) {
      highScore = score; localStorage.setItem(GAME_CONFIG.HIGH_SCORE_KEY, highScore.toString());
      highScoreVal.textContent = highScore; isNewRecord = true;
    }
    finalScoreVal.textContent = score; finalBestVal.textContent = highScore;
    if (isNewRecord) newRecordTag.classList.remove('hidden'); else newRecordTag.classList.add('hidden');
    hud.classList.add('hidden'); touchControls.classList.add('hidden'); gameOverScreen.classList.remove('hidden');
  }

  function pauseGame() { if (gameState === 'PLAYING') { gameState = 'PAUSED'; pauseScreen.classList.remove('hidden'); } }
  function resumeGame() { if (gameState === 'PAUSED') { gameState = 'PLAYING'; pauseScreen.classList.add('hidden'); } }
  function returnToMenu() { gameState = 'MENU'; pauseScreen.classList.add('hidden'); gameOverScreen.classList.add('hidden'); hud.classList.add('hidden'); touchControls.classList.add('hidden'); menuScreen.classList.remove('hidden'); }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'KeyA' || e.code === 'ArrowLeft') { keys.left = true; if (gameState === 'PLAYING') player.facing = 'LEFT'; }
    else if (e.code === 'KeyD' || e.code === 'ArrowRight') { keys.right = true; if (gameState === 'PLAYING') player.facing = 'RIGHT'; }
    else if (e.code === 'Space') { keys.shoot = true; }
    else if (e.code === 'KeyJ' || e.code === 'KeyZ') { keys.sword = true; if (gameState === 'PLAYING') performSwordAttack(); }
    else if (e.code === 'KeyP' || e.code === 'Escape') { if (gameState === 'PLAYING') pauseGame(); else if (gameState === 'PAUSED') resumeGame(); }
  });

  window.addEventListener('keyup', (e) => {
    if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
    if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
    if (e.code === 'Space') keys.shoot = false;
    if (e.code === 'KeyJ' || e.code === 'KeyZ') keys.sword = false;
  });

  ['touchstart', 'touchend', 'mousedown', 'keydown'].forEach((eventType) => {
    window.addEventListener(eventType, () => { SoundSystem.init(); }, { passive: true });
  });

  function bindButton(btn, callback) {
    if (!btn) return;
    let touched = false;
    btn.addEventListener('touchstart', (e) => {
      touched = true;
      if (e.cancelable) e.preventDefault();
      SoundSystem.init();
      callback(e);
    }, { passive: false });
    btn.addEventListener('click', (e) => {
      if (touched) {
        touched = false;
        return;
      }
      SoundSystem.init();
      callback(e);
    });
  }

  function handleTouchLeft(e) {
    if (e && e.cancelable) e.preventDefault();
    SoundSystem.init();
    if (gameState === 'PLAYING') { player.facing = 'LEFT'; keys.left = true; }
  }

  function handleTouchRight(e) {
    if (e && e.cancelable) e.preventDefault();
    SoundSystem.init();
    if (gameState === 'PLAYING') { player.facing = 'RIGHT'; keys.right = true; }
  }

  touchLeft.addEventListener('touchstart', handleTouchLeft, { passive: false });
  touchLeft.addEventListener('touchend', (e) => { if (e && e.cancelable) e.preventDefault(); keys.left = false; }, { passive: false });
  touchLeft.addEventListener('touchcancel', () => { keys.left = false; }, { passive: true });
  touchLeft.addEventListener('mousedown', handleTouchLeft);
  touchLeft.addEventListener('mouseup', () => { keys.left = false; });
  touchLeft.addEventListener('mouseleave', () => { keys.left = false; });

  touchRight.addEventListener('touchstart', handleTouchRight, { passive: false });
  touchRight.addEventListener('touchend', (e) => { if (e && e.cancelable) e.preventDefault(); keys.right = false; }, { passive: false });
  touchRight.addEventListener('touchcancel', () => { keys.right = false; }, { passive: true });
  touchRight.addEventListener('mousedown', handleTouchRight);
  touchRight.addEventListener('mouseup', () => { keys.right = false; });
  touchRight.addEventListener('mouseleave', () => { keys.right = false; });

  bindButton(touchSword, () => { if (gameState === 'PLAYING') performSwordAttack(); });

  diffButtons.forEach((btn) => {
    bindButton(btn, () => {
      SoundSystem.playClick();
      diffButtons.forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      selectedDifficulty = btn.getAttribute('data-diff');
    });
  });

  bindButton(btnStart, startGame);
  bindButton(btnPause, pauseGame);
  bindButton(btnResume, resumeGame);
  bindButton(btnRestartPause, startGame);
  bindButton(btnMenuPause, returnToMenu);
  bindButton(btnRestart, startGame);
  bindButton(btnMenuGameOver, returnToMenu);

  function update(dt) {
    if (gameState !== 'PLAYING') return;
    const now = Date.now();
    if (player.isInvincible && now > player.invincibleUntil) player.isInvincible = false;
    if (player.isSwordslashing && now > player.swordUntil) player.isSwordslashing = false;

    player.isMoving = false;
    const minX = GAME_CONFIG.PLAYER.MOVE_BOUNDS_MARGIN;
    const maxX = GAME_CONFIG.CANVAS_WIDTH - GAME_CONFIG.PLAYER.MOVE_BOUNDS_MARGIN - player.width;

    if (keys.left) { player.x -= GAME_CONFIG.PLAYER.SPEED; player.isMoving = true; player.facing = 'LEFT'; shootShuriken(); }
    if (keys.right) { player.x += GAME_CONFIG.PLAYER.SPEED; player.isMoving = true; player.facing = 'RIGHT'; shootShuriken(); }
    if (keys.shoot) { shootShuriken(); }

    player.x = Math.max(minX, Math.min(maxX, player.x));

    const diff = GAME_CONFIG.DIFFICULTIES[selectedDifficulty];
    const currentRampInterval = Math.max(
      GAME_CONFIG.SPAWN.MIN_INTERVAL_MS,
      (GAME_CONFIG.SPAWN.INITIAL_INTERVAL_MS - Math.floor((now - gameStartTime) / GAME_CONFIG.SPAWN.DIFFICULTY_RAMP_INTERVAL_MS) * GAME_CONFIG.SPAWN.INTERVAL_DECREASE_STEP) * diff.enemySpawnRateMultiplier
    );

    if (now - lastSpawnTime > currentRampInterval) { spawnEnemy(); lastSpawnTime = now; }

    for (let i = shurikens.length - 1; i >= 0; i--) {
      const s = shurikens[i]; s.x += s.vx; s.rotation += 0.3;
      if (s.x < -30 || s.x > GAME_CONFIG.CANVAS_WIDTH + 30) shurikens.splice(i, 1);
    }

    for (let eIdx = enemies.length - 1; eIdx >= 0; eIdx--) {
      const enemy = enemies[eIdx]; enemy.x += enemy.vx;
      for (let sIdx = shurikens.length - 1; sIdx >= 0; sIdx--) {
        const s = shurikens[sIdx];
        if (checkAABBCollision({ x: s.x, y: s.y, width: s.size, height: s.size }, enemy)) {
          shurikens.splice(sIdx, 1); enemy.hp -= 1; createParticles(s.x + 8, s.y + 8, '#f1c40f', 8);
          if (enemy.hp <= 0) {
            SoundSystem.playEnemyHit(); createParticles(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, GAME_CONFIG.ENEMY_TYPES[enemy.type].color, GAME_CONFIG.PARTICLES.DEATH_COUNT);
            score += Math.round(enemy.scoreValue * diff.scoreMultiplier); scoreVal.textContent = score; enemies.splice(eIdx, 1); break;
          } else { SoundSystem.playEnemyHit(); }
        }
      }

      if (enemies[eIdx] && !player.isInvincible && checkAABBCollision(enemy, player)) {
        player.hp -= 1; updateHpDisplay(); SoundSystem.playPlayerHurt(); createParticles(player.x + player.width / 2, player.y + player.height / 2, '#e74c3c', 15);
        if (player.hp <= 0) { triggerGameOver(); return; }
        else { player.isInvincible = true; player.invincibleUntil = now + GAME_CONFIG.PLAYER.INVINCIBILITY_DURATION_MS; }
      }

      if ((enemy.vx < 0 && enemy.x < -enemy.width - 50) || (enemy.vx > 0 && enemy.x > GAME_CONFIG.CANVAS_WIDTH + 50)) enemies.splice(eIdx, 1);
    }

    for (let pIdx = particles.length - 1; pIdx >= 0; pIdx--) {
      const p = particles[pIdx]; p.x += p.vx; p.y += p.vy; p.life -= 0.04;
      if (p.life <= 0) particles.splice(pIdx, 1);
    }
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#0f111a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#f5f6fa'; ctx.beginPath(); ctx.arc(canvas.width / 2, 90, 45, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#dcdde1'; ctx.beginPath(); ctx.arc(canvas.width / 2 - 10, 80, 10, 0, Math.PI * 2); ctx.arc(canvas.width / 2 + 15, 105, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#181b26'; ctx.beginPath(); ctx.moveTo(0, canvas.height - 40); ctx.lineTo(canvas.width, canvas.height - 40); ctx.lineTo(canvas.width, canvas.height); ctx.lineTo(0, canvas.height); ctx.fill();
    ctx.fillStyle = '#2c1e14'; ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
    ctx.fillStyle = '#c0392b'; ctx.fillRect(0, canvas.height - 40, canvas.width, 4);

    if (gameState === 'PLAYING' || gameState === 'PAUSED') {
      enemies.forEach((enemy) => {
        const spriteSet = sprites.enemies[enemy.type];
        const sprite = enemy.facing === 'RIGHT' ? spriteSet.right : spriteSet.left;
        ctx.drawImage(sprite, enemy.x, enemy.y);
        if (enemy.maxHp > 1) {
          ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(enemy.x, enemy.y - 8, enemy.width, 4);
          ctx.fillStyle = '#2ecc71'; ctx.fillRect(enemy.x, enemy.y - 8, enemy.width * (enemy.hp / enemy.maxHp), 4);
        }
      });

      shurikens.forEach((s) => {
        ctx.save(); ctx.translate(s.x + s.size / 2, s.y + s.size / 2); ctx.rotate(s.rotation);
        ctx.drawImage(sprites.shuriken, -s.size / 2, -s.size / 2, s.size, s.size); ctx.restore();
      });

      if (player && (!player.isInvincible || Math.floor(Date.now() / 80) % 2 === 0)) {
        const pSprite = player.facing === 'RIGHT' ? (player.isMoving ? sprites.ninja.runRight : sprites.ninja.idleRight) : (player.isMoving ? sprites.ninja.runLeft : sprites.ninja.idleLeft);
        ctx.drawImage(pSprite, player.x, player.y);

        if (player.isSwordslashing) {
          ctx.save();
          ctx.strokeStyle = '#f1c40f';
          ctx.lineWidth = 4;
          ctx.shadowColor = '#e74c3c';
          ctx.shadowBlur = 8;
          ctx.beginPath();
          const startX = player.facing === 'RIGHT' ? player.x + player.width : player.x;
          const endX = player.facing === 'RIGHT' ? player.x + player.width + GAME_CONFIG.PLAYER.SWORD_RANGE : player.x - GAME_CONFIG.PLAYER.SWORD_RANGE;
          ctx.arc(
            startX, player.y + player.height / 2,
            GAME_CONFIG.PLAYER.SWORD_RANGE,
            player.facing === 'RIGHT' ? -Math.PI / 4 : Math.PI * 3 / 4,
            player.facing === 'RIGHT' ? Math.PI / 4 : Math.PI * 5 / 4
          );
          ctx.stroke();
          ctx.restore();
        }
      }

      particles.forEach((p) => {
        ctx.fillStyle = p.color; ctx.globalAlpha = p.life; ctx.fillRect(p.x, p.y, p.size, p.size); ctx.globalAlpha = 1.0;
      });
    }
  }

  function gameLoop() { update(1/60); render(); requestAnimationFrame(gameLoop); }
  requestAnimationFrame(gameLoop);
});
  </script>
</body>
</html>
